<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibeSpaces — Platform</title>
  <link rel="icon" href="Spaces.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080d;
      --card: #13131a;
      --text: #f0f0f5;
      --muted: #9393a8;
      --accent: #c084fc;
      --accent2: #60a5fa;
      --border: rgba(255,255,255,0.08);
      --danger: #f87171;
      --success: #34d399;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    h1, h2, h3, h4 {
      font-family: 'Outfit', sans-serif;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }

    .logo {
      font-size: 1.45rem;
      font-weight: 700;
      background: linear-gradient(90deg, #c084fc, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #c084fc, #60a5fa);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-danger {
      background: transparent;
      border: 1px solid rgba(248,113,113,0.3);
      color: var(--danger);
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0e0e14;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    /* Auth */
    #authSection {
      max-width: 420px;
      margin: 60px auto;
    }

    .auth-title {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-title h1 {
      font-size: 1.9rem;
      margin-bottom: 8px;
    }

    .auth-title p {
      color: var(--muted);
    }

    .switch-auth {
      text-align: center;
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .switch-auth span {
      color: var(--accent);
      cursor: pointer;
    }

    /* Vibes */
    .vibe-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .vibe-author {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .vibe-time {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .vibe-title {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .vibe-content {
      color: #d1d1db;
      margin-bottom: 14px;
      white-space: pre-wrap;
    }

    .comments-section {
      border-top: 1px solid var(--border);
      padding-top: 14px;
      margin-top: 14px;
    }

    .comment {
      background: rgba(255,255,255,0.03);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .comment-author {
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .comment-form input {
      margin-bottom: 0;
    }

    .message {
      margin-top: 12px;
      font-size: 0.9rem;
      text-align: center;
    }

    .hidden { display: none !important; }

    #appSection { display: none; }
  </style>
</head>
<body>

  <div class="container">

    <!-- Header -->
    <header>
      <a href="info.html" class="logo">VibeSpaces</a>
      <div class="user-info">
        <span id="userEmail"></span>
        <button class="btn btn-danger hidden" id="logoutBtn">Logout</button>
      </div>
    </header>

    <!-- ========== AUTH SECTION ========== -->
    <div id="authSection">
      <div class="auth-title">
        <h1>Welcome to VibeSpaces</h1>
        <p>Sign in or create an account to continue</p>
      </div>

      <div class="card">
        <!-- Login -->
        <div id="loginView">
          <input type="email" id="loginEmail" placeholder="Email">
          <input type="password" id="loginPassword" placeholder="Password">
          <button class="btn btn-primary" style="width:100%" id="loginBtn">Sign In</button>
          <div class="switch-auth">
            Don't have an account? <span id="showSignup">Create a new account</span>
          </div>
        </div>

        <!-- Signup -->
<div id="signupView" class="hidden">
  <input type="text" id="signupUsername" placeholder="Choose a Username" maxlength="20">
  <input type="email" id="signupEmail" placeholder="Email">
  <input type="password" id="signupPassword" placeholder="Password (min 6 characters)">
  <button class="btn btn-primary" style="width:100%" id="signupBtn">Create Account</button>
  <div class="switch-auth">
    Already have an account? <span id="showLogin">Sign In</span>
  </div>
</div>

        <p class="message" id="authMessage"></p>
      </div>
    </div>

    <!-- ========== APP SECTION ========== -->
    <div id="appSection">

      <!-- Create Vibe -->
      <div class="card">
        <h3 style="margin-bottom: 14px;">Create a Vibe</h3>
        <input type="text" id="vibeTitle" placeholder="Title">
        <textarea id="vibeContent" placeholder="What's your vibe?"></textarea>
        <button class="btn btn-primary" id="createVibeBtn">Create</button>
        <p class="message" id="vibeMessage"></p>
      </div>

      <!-- Feed -->
      <h3 style="margin: 10px 0 16px;">Feed</h3>
      <div id="vibesContainer">
        <p style="color: var(--muted); text-align: center;">Loading vibes...</p>
      </div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyBN4dPfn_N8HGBe3gtbj9fegKhQAvcrcUE",
    authDomain: "vibespaces-web-82a77.firebaseapp.com",
    projectId: "vibespaces-web-82a77",
    storageBucket: "vibespaces-web-82a77.firebasestorage.app",
    messagingSenderId: "838833945338",
    appId: "1:838833945338:web:be4304176e26e794bca743"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // DOM Elements
  const authSection = document.getElementById('authSection');
  const appSection = document.getElementById('appSection');
  const userEmailSpan = document.getElementById('userEmail');
  const logoutBtn = document.getElementById('logoutBtn');
  const authMessage = document.getElementById('authMessage');

  // Switch between Login and Signup
  document.getElementById('showSignup').onclick = () => {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('signupView').classList.remove('hidden');
    authMessage.textContent = '';
  };

  document.getElementById('showLogin').onclick = () => {
    document.getElementById('signupView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    authMessage.textContent = '';
  };

  // Sign Up
  document.getElementById('signupBtn').onclick = async () => {
    const username = document.getElementById('signupUsername').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;

    if (!username || !email || !password) {
      authMessage.style.color = 'var(--danger)';
      authMessage.textContent = 'Please fill in all fields';
      return;
    }

    if (username.length < 3) {
      authMessage.style.color = 'var(--danger)';
      authMessage.textContent = 'Username must be at least 3 characters';
      return;
    }

    if (password.length < 6) {
      authMessage.style.color = 'var(--danger)';
      authMessage.textContent = 'Password must be at least 6 characters';
      return;
    }

    try {
      const userCredential = await auth.createUserWithEmailAndPassword(email, password);
      await userCredential.user.updateProfile({
        displayName: username
      });
      authMessage.style.color = 'var(--success)';
      authMessage.textContent = 'Account created successfully!';
    } catch (err) {
      authMessage.style.color = 'var(--danger)';
      if (err.code === 'auth/email-already-in-use') {
        authMessage.textContent = 'This email is already registered. Please Sign In instead.';
      } else if (err.code === 'auth/invalid-email') {
        authMessage.textContent = 'Please enter a valid email address';
      } else if (err.code === 'auth/weak-password') {
        authMessage.textContent = 'Password is too weak.';
      } else {
        authMessage.textContent = 'Something went wrong. Please try again.';
      }
    }
  };

  // Login
  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) {
      authMessage.style.color = 'var(--danger)';
      authMessage.textContent = 'Please fill in all fields';
      return;
    }

    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (err) {
      authMessage.style.color = 'var(--danger)';
      if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
        authMessage.textContent = 'No account found with these credentials. Please create a new account.';
      } else if (err.code === 'auth/invalid-email') {
        authMessage.textContent = 'Please enter a valid email address';
      } else {
        authMessage.textContent = 'Login failed. Please try again.';
      }
    }
  };

  // Logout
  logoutBtn.onclick = () => auth.signOut();

  // Auth State Observer
  auth.onAuthStateChanged(user => {
    if (user) {
      authSection.style.display = 'none';
      appSection.style.display = 'block';
      userEmailSpan.textContent = user.displayName || user.email;
      logoutBtn.classList.remove('hidden');
      loadVibes();
    } else {
      authSection.style.display = 'block';
      appSection.style.display = 'none';
      userEmailSpan.textContent = '';
      logoutBtn.classList.add('hidden');
    }
  });

  // Create Vibe
  document.getElementById('createVibeBtn').onclick = async () => {
    const title = document.getElementById('vibeTitle').value.trim();
    const content = document.getElementById('vibeContent').value.trim();
    const msg = document.getElementById('vibeMessage');

    if (!title || !content) {
      msg.style.color = 'var(--danger)';
      msg.textContent = 'Title and content are required';
      return;
    }

    try {
      await db.collection('vibes').add({
        title,
        content,
        author: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
        authorId: auth.currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        comments: []
      });

      document.getElementById('vibeTitle').value = '';
      document.getElementById('vibeContent').value = '';
      msg.style.color = 'var(--success)';
      msg.textContent = 'Vibe created!';
      setTimeout(() => msg.textContent = '', 2000);
      loadVibes();
    } catch (err) {
      msg.style.color = 'var(--danger)';
      msg.textContent = 'Error creating vibe';
    }
  };

  // Load Vibes
async function loadVibes() {
  const container = document.getElementById('vibesContainer');
  container.innerHTML = '<p style="color:var(--muted);text-align:center">Loading vibes...</p>';

  try {
    const snapshot = await db.collection('vibes')
      .orderBy('createdAt', 'desc')
      .get();

    if (snapshot.empty) {
      container.innerHTML = '<p style="color:var(--muted);text-align:center">No vibes yet. Be the first to share something!</p>';
      return;
    }

    container.innerHTML = '';

    snapshot.forEach(doc => {
      const vibe = doc.data();
      const vibeId = doc.id;
      const time = vibe.createdAt ? vibe.createdAt.toDate().toLocaleString() : 'Just now';
      const isOwner = auth.currentUser && vibe.authorId === auth.currentUser.uid;

      const vibeEl = document.createElement('div');
      vibeEl.className = 'card';
      vibeEl.innerHTML = `
        <div class="vibe-header">
          <div class="vibe-author">${vibe.author}</div>
          <div class="vibe-time">${time}</div>
        </div>
        <h3 class="vibe-title">${vibe.title}</h3>
        <div class="vibe-content">${vibe.content}</div>

        ${isOwner ? `<button class="btn btn-danger" style="margin-top:10px;font-size:0.8rem;padding:6px 12px;" onclick="deleteVibe('${vibeId}')">Delete Vibe</button>` : ''}

        <div class="comments-section">
          <div id="comments-${vibeId}"></div>
          <div class="comment-form">
            <input type="text" id="comment-input-${vibeId}" placeholder="Write a comment...">
            <button class="btn btn-primary" onclick="addComment('${vibeId}')">Reply</button>
          </div>
        </div>
      `;
      container.appendChild(vibeEl);

      loadComments(vibeId, vibe.comments || []);
    });
  } catch (err) {
    container.innerHTML = `<p style="color:var(--danger);text-align:center">Error loading vibes</p>`;
  }
}

// Delete Vibe
window.deleteVibe = async (vibeId) => {
  if (!confirm('Are you sure you want to delete this vibe?')) return;

  try {
    await db.collection('vibes').doc(vibeId).delete();
    loadVibes();
  } catch (err) {
    alert('Error deleting vibe');
  }
};
  // Load Comments
  function loadComments(vibeId, comments) {
    const container = document.getElementById(`comments-${vibeId}`);
    if (!comments || comments.length === 0) {
      container.innerHTML = '';
      return;
    }

    container.innerHTML = comments.map(c => `
      <div class="comment">
        <div class="comment-author">${c.author}</div>
        <div>${c.text}</div>
      </div>
    `).join('');
  }

  // Add Comment
  window.addComment = async (vibeId) => {
    const input = document.getElementById(`comment-input-${vibeId}`);
    const text = input.value.trim();
    if (!text) return;

    try {
      const vibeRef = db.collection('vibes').doc(vibeId);
      const doc = await vibeRef.get();
      const comments = doc.data().comments || [];

      comments.push({
        text,
        author: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
        createdAt: new Date().toISOString()
      });

      await vibeRef.update({ comments });
      input.value = '';
      loadVibes();
    } catch (err) {
      alert('Error adding comment');
    }
  };
</script>
</body>
</html>
